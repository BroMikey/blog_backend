# This workflow will build a golang project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-go

name: Go

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build_test:
    name: Build and Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: root
          POSTGRES_PASSWORD: 123456
          POSTGRES_DB: website
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -h localhost -U root -d website" 
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Set up Go
        uses: actions/setup-go@v5  
        with:
          go-version: '1.25'

      - name: Check out code  
        uses: actions/checkout@v4

      - name: run migrations
        run: |
          go install github.com/golang-migrate/migrate/v4/cmd/migrate@latest
          make migrateup
        env:  
          DB_SOURCE: postgresql://root:123456@localhost:5432/website?sslmode=disable

      - name: Build
        run: go build -v ./...

      - name: Test
        env:  # 测试步骤也需要数据库连接变量
          DB_SOURCE: postgresql://root:123456@localhost:5432/website?sslmode=disable
        run: go test -v ./...

